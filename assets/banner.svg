<svg width="100%" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#161d2e">
        <animate attributeName="stop-color" values="#161d2e;#1e1b4b;#161d2e" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#38bdf8;#a78bfa" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="15" />
  
  <!-- Animated grid pattern -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1.5">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)">
      <animate attributeName="x" values="0;-40" dur="3s" repeatCount="indefinite" />
      <animate attributeName="y" values="0;-40" dur="3s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Glowing background elements -->
  <circle cx="150" cy="125" r="80" fill="#6366f1" opacity="0.1" filter="url(#glow)">
    <animate attributeName="r" values="80;100;80" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="650" cy="125" r="80" fill="#38bdf8" opacity="0.1" filter="url(#glow)">
    <animate attributeName="r" values="80;100;80" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Title -->
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#textGrad)" filter="url(#glow)">
    InsightPulse Dashboard
  </text>
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff">
    InsightPulse Dashboard
  </text>
  
  <!-- Subtitle -->
  <text x="50%" y="65%" dominant-baseline="middle" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
    Modern • Interactive • Data-Driven Analytics
  </text>

  <!-- Decorative floating particles -->
  <circle cx="200" cy="60" r="4" fill="#6366f1">
    <animate attributeName="cy" values="60;50;60" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="190" r="5" fill="#10b981">
    <animate attributeName="cy" values="190;175;190" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="100" cy="180" r="3" fill="#38bdf8">
    <animate attributeName="cy" values="180;165;180" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="720" cy="80" r="4" fill="#f43f5e">
    <animate attributeName="cy" values="80;95;80" dur="3.5s" repeatCount="indefinite" />
  </circle>
</svg>
